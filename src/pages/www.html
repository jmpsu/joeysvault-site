<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JoeysVault</title>
<style>
  html, body { margin: 0; height: 100%; background: #161618; overflow: hidden; }
  canvas#starfield { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; background: #161618; }
  nav.links {
    position: fixed; z-index: 2;
    left: 50%; top: 42%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  a.projects {
    cursor: pointer;
    color: rgba(247,241,232,.86);
    text-decoration: none;
    font-family: "Helvetica Neue", "Segoe UI", sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: .46em;
    text-transform: lowercase;
    padding: 14px 18px;
    animation: glimmer 3.4s ease-in-out infinite;
  }
  a.projects:hover {
    color: #fffaf2;
    text-shadow: 0 0 18px rgba(240,195,106,.95), 0 0 3px rgba(255,255,255,.75);
  }
  @keyframes glimmer {
    0%, 100% { color: rgba(247,241,232,.62); text-shadow: 0 0 0 rgba(240,195,106,0); }
    50% { color: #fffaf2; text-shadow: 0 0 14px rgba(240,195,106,.85), 0 0 2px rgba(255,255,255,.55); }
  }
  @media (max-width: 800px) {
    a.projects { font-size: 13px; letter-spacing: .28em; }
  }
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<script>
(function () {
  var preset = { n: 720, size: 1.6, size0: 0.4, speed: 0.00045, speed0: 0.0002, chance: 0.009, base: 0.35, amp: 0.6, life: 70, vx: 3.2, vxr: 2.2, vy: 1.1, vyr: 1.4 };
  var canvas = document.getElementById("starfield");
  var ctx = canvas.getContext("2d");
  var stars = [];
  var shootingStars = [];
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
  }
  function initStars() {
    stars = [];
    for (var i = 0; i < preset.n; i++) {
      stars.push({
        angle: Math.random() * Math.PI * 2,
        radius: Math.random() * Math.sqrt(canvas.width * canvas.width + canvas.height * canvas.height),
        speed: Math.random() * preset.speed + preset.speed0,
        size: Math.random() * preset.size + preset.size0
      });
    }
  }
  function spawnShootingStar() {
    if (shootingStars.length === 0 && Math.random() < preset.chance) {
      shootingStars.push({
        x: Math.random() * canvas.width * 0.5,
        y: Math.random() * canvas.height * 0.5,
        vx: preset.vx + Math.random() * preset.vxr,
        vy: preset.vy + Math.random() * preset.vyr,
        life: preset.life,
        initialLife: preset.life
      });
    }
  }
  function animate() {
    var centerX = canvas.width;
    var centerY = canvas.height;
    ctx.fillStyle = "#161618";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < stars.length; i++) {
      var star = stars[i];
      star.angle += star.speed;
      var x = centerX + star.radius * Math.cos(star.angle);
      var y = centerY + star.radius * Math.sin(star.angle);
      var flicker = preset.base + Math.abs(Math.sin(Date.now() * 0.0015 + i)) * preset.amp;
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255," + flicker + ")";
      ctx.arc(x, y, star.size, 0, Math.PI * 2);
      ctx.fill();
    }
    spawnShootingStar();
    for (var s = shootingStars.length - 1; s >= 0; s--) {
      var shot = shootingStars[s];
      var opacity = shot.life / shot.initialLife;
      var grad = ctx.createLinearGradient(shot.x, shot.y, shot.x - shot.vx * 35, shot.y - shot.vy * 35);
      grad.addColorStop(0, "rgba(255,255,255," + opacity + ")");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(shot.x, shot.y);
      ctx.lineTo(shot.x - shot.vx * 18, shot.y - shot.vy * 18);
      ctx.stroke();
      shot.x += shot.vx;
      shot.y += shot.vy;
      shot.life -= 1;
      if (shot.life <= 0) shootingStars.splice(s, 1);
    }
    requestAnimationFrame(animate);
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  animate();
})();
</script>
<nav class="links">
  <a class="projects" href="https://projects.joeysvault.app">projects</a>
  <a class="projects" href="https://jellyfin.joeysvault.app">media</a>
  <a class="projects" href="https://art.joeysvault.app">art</a>
</nav>
</body>
</html>
